<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOTAS - POST</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
        <header>
        <nav>
            <a href="contato.html">CONTATO</a>
            <a href="login.html">LOGIN</a>
            <a href="notas.html">NOTAS</a>
        </nav>
    </header>

    <main>
        <div class="card">
            <h1>BOLETIM</h1>
            <form action="../php/notas.php" method="post">
                <div class="campo">
                    <label for="aluno">Aluno:</label>
                    <input  type="text"
                            name="aluno"
                            id="aluno">
                </div>
                <div class="campo">
                    <label for="nota1">Nota 1:</label>
                    <input  type="number"
                            name="nota1"
                            id="nota1"
                            step="0.1"
                            min="0"
                            max="10">
                </div>
                <div class="campo">
                    <label for="nota2">Nota 2:</label>
                    <input  type="number"
                            name="nota2"
                            id="nota2"
                            step="0.1"
                            min="0"
                            max="10">
                </div>
                <div class="campo">
                    <label for="nota3">Nota 3:</label>
                    <input  type="number"
                            name="nota3"
                            id="nota3"
                            step="0.1"
                            min="0"
                            max="10">
                </div>
                <button type="submit">CALCULAR</button>
            </form>
        </div>
    </main>
</body>
</html>
